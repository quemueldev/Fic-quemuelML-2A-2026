<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="calculator">
        <p id="display"></p>
        <div class="row">
            <button onclick="addNum(this)" value="1">1</button>
            <button onclick="addNum(this)" value="2">2</button>
            <button onclick="addNum(this)" value="3">3</button>
            <button onclick="addNum(this)" value="+">+</button>
        </div>
        <div class="row">
            <button onclick="addNum(this)" value="4">4</button>
            <button onclick="addNum(this)" value="5">5</button>
            <button onclick="addNum(this)" value="6">6</button>
            <button onclick="addNum(this)" value="-">-</button>
        </div>
        <div class="row">
            <button onclick="addNum(this)" value="7">7</button>
            <button onclick="addNum(this)" value="8">8</button>
            <button onclick="addNum(this)" value="9">9</button>
            <button onclick="addNum(this)" value="*">x</button>
        </div>
        <div class="row">
            <button onclick="removeNum()">c</button>
            <button onclick="addNum(this)" value="0">0</button>
            <button onclick="addNum(this)" value="/">/</button>
            <button onclick="calculate()" id="igual">=</button>
        </div>
    </div>
</body>
<script src="main.js"></script>
</html>
